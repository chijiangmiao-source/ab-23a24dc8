services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    ports:
      # Host-side port is configurable; the API always uses the container port.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    image: pulse-collector:latest
    container_name: ${API_CONTAINER_NAME:-pulse-api}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      WINDOW_AHEAD: ${WINDOW_AHEAD:-32}
    ports:
      - "${API_HOST_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  # One-shot verification: build checks + tests + HTTP smoke (out-of-order
  # gap filling, concurrent retries, restart recovery). Reports via exit code.
  verify:
    image: pulse-collector:latest
    build: .
    working_dir: /app
    command: ["bash", "scripts/verify.sh"]
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@db:5432/${POSTGRES_DB:-pulse}
      BASE_URL: http://api:8000
      API_CONTAINER_NAME: ${API_CONTAINER_NAME:-pulse-api}
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"

volumes:
  pgdata:
